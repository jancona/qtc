; qtcd configuration: every setting, with its default.
;
; Sections and keys are case-insensitive. Lists are comma-separated.
; Durations are Go durations: 90s, 5m, 24h. Lines starting with ';' or '#'
; are comments. An unknown section or setting is an error, so a typo is
; reported instead of ignored.

[General]
; The node's own callsign, used whole: your base callsign padded to eight
; characters with the module letter ninth, e.g. "N1ADJ   Q". Its base
; callsign names the node's local room (#N1ADJ). Required.
Callsign=N1ADJ   Q
; Persistent state: the node key, the mailbox journal and the
; delivered-once journal. Empty keeps everything in memory (tests only):
; a restart then loses stored messages and may repeat deliveries.
DataDir=/var/lib/qtcd
; The node key (ECDSA P-256, PKCS #8 PEM), created if missing. Its peer ID
; is the node's identity; keep it. Default: <DataDir>/node.key.
KeyFile=
; Loopback host:port for the admin HTTP interface (GET /status). Empty
; disables it. It refuses anything but a loopback address.
Admin=127.0.0.1:8017
; Software string in the node card. Default: qtcd/<version>.
Software=
; How often to log a metrics line (memory, CPU, peers). Empty disables.
MetricsInterval=15m
; Devices this node hears at start as if from a local client (testing).
Devices=
; Rooms this node carries; empty carries all.
Rooms=
; Deliver a room message back to the device that sent it (testing).
EchoRoomMessages=false

[Network]
; libp2p listen addresses. A public station uses a fixed port such as
; /ip4/0.0.0.0/tcp/4001; others can let the system choose (tcp/0).
Listen=/ip4/0.0.0.0/tcp/0
; Public stations to connect to at start, as multiaddrs ending in
; /p2p/<peer ID>. They also serve as relays for a node behind NAT.
Bootstrap=/dns4/ham.n1adj.net/tcp/4001/p2p/QmdxViFZP4PK5TL3xANxScyaFnvBfdqfbQqjjJGhvJvuSg
; Capabilities: any of public, relay, mailbox, clients. Empty on a hotspot;
; a public station uses public,relay,mailbox.
Caps=
; Kademlia peer discovery. Leave on.
DHT=true
; Seed mailbox stations (peer IDs), used only when presence has not yet
; shown any mailbox-capable station. Usually empty.
MailboxMembers=
; Mailbox target size for records this node creates. Default 2.
K=2

[Timers]
; Node protocol §11 defaults; change only for testing.
PresenceInterval=5m
SweepInterval=1h
RecordRefresh=5m
TakeoverPeriod=168h
MemberFailSilence=24h
MemberFailSweeps=3

[Delivery]
; A radio heard within this long is in reach: messages for it are sent at
; once. A message for a radio not heard that recently is held in the
; mailbox and sent when the radio is next heard (transmits).
ReachWindow=1h
; When a radio comes back in reach, it is sent at most this many waiting
; messages, most recent, oldest first, plus one note saying how many older
; ones were left out.
ReplayLimit=10

; The M17_inet client face: the node presents itself to gateways and
; clients as a reflector (M17-QTC). It runs when [Inet] or any [Module X]
; is present.
[Inet]
; UDP address. 127.0.0.1:17000 when the gateway runs on this machine;
; 0.0.0.0:17000 to accept gateways and clients from elsewhere.
Listen=127.0.0.1:17000
; M17Hosts.txt, for resolving the reflector names in [Module X].
HostsFile=/opt/m17/rpi-dashboard/files/M17Hosts.txt
; Address ranges (CIDR) whose clients are RF gateways; others are internet
; clients. Default: loopback and the private ranges.
Gateways=
; If set, internet clients may use only these base callsigns: others are
; refused at connect, and their packets ignored. Gateways are not limited.
; It keeps strangers out; it does not verify anyone's identity.
AllowCallsigns=

; One section per module letter a gateway or client can link to. Voice on a
; module always passes through to its upstream reflector and module.
; Mode qtc: SMS (and native QTC packets) go into QTC and are never forwarded.
; Mode native: a plain proxy; SMS passes through too.
[Module A]
Reflector=M17-M17
Module=T
Mode=qtc
