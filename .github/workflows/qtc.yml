name: qtc

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: Test
        run: go test -race ./...

  package:
    needs: test
    # Packages are built for tags, and on demand from the Actions tab.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [ arm64, armhf, amd64 ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Version
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            V=${GITHUB_REF#refs/tags/v}
          else
            V="0.0.0~dev.${GITHUB_SHA::8}"
          fi
          # Debian orders 0.1.0~rc1 before 0.1.0; a hyphen would not.
          echo "deb=${V//-/\~}" >> "$GITHUB_OUTPUT"
      - name: Build package
        run: cmd/qtcd/packaging/scripts/build-deb.sh "${{ steps.version.outputs.deb }}" ${{ matrix.arch }}
      - name: Inspect package
        run: |
          dpkg-deb --info build/*.deb
          dpkg-deb --contents build/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: qtcd-${{ matrix.arch }}
          path: |
            build/*.deb
            build/*.tar.gz

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
